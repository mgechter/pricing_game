# Declarative game / treatment definitions.
#
# The engine (R/engine/), the debrief, and (later) the Shiny app all read from
# here, so the live game, its benchmarks, and the slides cannot drift apart.
#
# Fields
#   id         unique key (referenced by the app and the debrief)
#   label      shown to players and admin
#   rounds     number of rounds — a parameter, not hard-coded
#   pairing    fixed | random_each_round | random_once
#   horizon    known | hidden_end | random_continuation
#   reveal     per_round | end_only
#   decisions  decision inputs the player UI renders (v1: [price])
#   demand.model   -> key in DEMAND_MODELS (resolve.R)
#   demand.params  -> passed verbatim to the demand model
#   benchmarks.ne / benchmarks.monopoly   a number, or "compute" (see equilibria.R)
#   predictions   optional list of pre-game questions the student answers before
#                 round 1; each: id, type (numeric | choice | text), prompt,
#                 choices (for choice), reference (theory answer, drawn in the
#                 debrief), optional: true (doesn't block entry)
#
# HOTELLING PARAMETER NOTE
#   The share formula is  share_i = 0.5 + (p_j - p_i) / (2 * t * L),  with a
#   residual branch  min(1, (V - p_i) / (t * L))  and full capture at gap
#   `capture_gap`.  Here `t` is the spreadsheet's $O$3 cell and L its "/100".
#   The 2026 sheet ran  t (O3) = 2  in BOTH differentiated games (so they were
#   mechanically identical; NE = mc + t*L = $200).  The values below are the
#   *intended* design — genuine high vs low differentiation.

games:
  - id: bertrand
    label: "Bertrand (homogeneous good)"
    rounds: 5             # ECON 30303's 2025 game ran 5, so the leaderboard compares across years
    pairing: fixed
    horizon: known
    reveal: per_round
    decisions: [price]
    demand:
      model: bertrand_homogeneous
      params:
        choke: 100        # market demand  D = choke - P
        mc: 0
        tie: split        # equal prices split the market 50/50
    benchmarks:
      ne: compute         # = mc            = 0
      monopoly: compute   # = (choke+mc)/2  = 50
    predictions:
      - {id: own_r1,      type: numeric, prompt: "What price will you set in round 1?"}
      - {id: class_final, type: numeric, prompt: "What will the class's average price be in the last round?"}
      - {id: eq_guess,    type: numeric, prompt: "Where do you think prices end up in the long run?", reference: 0}
      - {id: br_50,       type: numeric, prompt: "If your rival prices at $50, what price is best for you?", reference: 49}
      - {id: can_hold,    type: choice,  choices: ["Yes", "No"], prompt: "Can you and your partner keep prices high the whole game?"}
      - {id: why,         type: text,    optional: true, prompt: "One sentence — why?"}

  - id: hotelling_high
    label: "Differentiated products — high differentiation (t = 1)"
    rounds: 10
    pairing: fixed
    horizon: known
    reveal: per_round
    decisions: [price]
    demand:
      model: hotelling_linear
      params:
        V: 200              # reservation price ($O$2); ECON 30303's 2025 game used 200, so the leaderboard compares across years
        t: 1                # differentiation / transport parameter ($O$3); 2026 sheet used 2
        L: 100              # street length
        M: 100              # market size (consumers)
        mc: 0
        coverage_decay: true  # market empties from the middle when both prices are high
    benchmarks:
      ne: compute         # = mc + t*L    = 100
      monopoly: compute   # = V - t*L/2   = 150
      collusive: compute  # with coverage decay, also 150
    predictions:
      - {id: own_r1,      type: numeric, prompt: "What price will you set in round 1?"}
      - {id: class_final, type: numeric, prompt: "What will the class's average price be in the last round?"}
      - {id: eq_guess,    type: numeric, prompt: "Where do you think prices end up in the long run?", reference: 100}
      - {id: vs_bertrand, type: choice,  choices: [Higher, "About the same", Lower], prompt: "Compared with the Bertrand game, prices here will be…"}
      - {id: why,         type: text,    optional: true, prompt: "One sentence — why?"}

  - id: hotelling_low
    label: "Differentiated products — low differentiation (t = 0.5)"
    rounds: 10
    pairing: fixed
    horizon: known
    reveal: per_round
    decisions: [price]
    demand:
      model: hotelling_linear
      params:
        V: 200              # as in ECON 30303's 2025 game
        t: 0.5
        L: 100
        M: 100
        mc: 0
        coverage_decay: true
    benchmarks:
      ne: compute         # = mc + t*L    = 50
      monopoly: compute   # = V - t*L/2   = 175
      collusive: compute  # with coverage decay, also 175
    predictions:
      - {id: own_r1,      type: numeric, prompt: "What price will you set in round 1?"}
      - {id: class_final, type: numeric, prompt: "What will the class's average price be in the last round?"}
      - {id: eq_guess,    type: numeric, prompt: "Where do you think prices end up with weaker differentiation?", reference: 50}
      - {id: vs_high,     type: choice,  choices: [Higher, "About the same", Lower], prompt: "Compared with the strongly-differentiated game, prices here will be…"}
      - {id: why,         type: text,    optional: true, prompt: "One sentence — why?"}
